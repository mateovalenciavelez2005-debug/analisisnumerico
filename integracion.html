<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Integración Numérica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<style>
    body {
        font-family: Arial;
        margin: 20px;
    }
    input, button {
        padding: 6px;
        margin: 5px 0;
    }
    .resultado {
        margin-top: 20px;
        padding: 10px;
        background: #f3f3f3;
        border-left: 4px solid #0077cc;
    }
</style>
</head>

<body>
<h2>Integración Numérica: Trapecio, Simpson 1/3 y Simpson 3/8</h2>

<label>Ingrese f(x):</label><br>
<input id="fx" type="text" value="sin(x) + x^2"><br>

<label>Límite inferior (a):</label><br>
<input id="a" type="number" step="any" value="0"><br>

<label>Límite superior (b):</label><br>
<input id="b" type="number" step="any" value="3"><br>

<label>Subintervalos (n):</label><br>
<input id="n" type="number" step="1" value="6"><br><br>

<button onclick="calcular()">Calcular</button>

<div id="salida" class="resultado"></div>

<script>

// ------------------------------
//     FUNCIÓN PRINCIPAL
// ------------------------------
function calcular() {
    let f_str = document.getElementById("fx").value;
    let a = parseFloat(document.getElementById("a").value);
    let b = parseFloat(document.getElementById("b").value);
    let n = parseInt(document.getElementById("n").value);

    // Permitir usar ^
    f_str = f_str.replaceAll("^", "**");

    // Crear función evaluable
    const f = x => math.evaluate(f_str, {x: x});

    let mensajes = "";

    // Validaciones como Python
    if (n % 2 !== 0) {
        mensajes += "Advertencia: Simpson 1/3 requiere n par. Se incrementó en 1.<br>";
        n += 1;
    }

    if (n % 3 !== 0) {
        mensajes += "Advertencia: Simpson 3/8 requiere n múltiplo de 3. Se ajustó.<br>";
        while (n % 3 !== 0) n++;
    }

    const h = (b - a) / n;

    // Crear xi y f(xi)
    const xi = [...Array(n + 1).keys()].map(i => a + i * h);
    const fi = xi.map(v => f(v));

    // ------------------------------
    //    TRAPECIO COMPUESTO
    // ------------------------------
    const sumTrap = fi.slice(1, -1).reduce((a, b) => a + b, 0);
    const trap = (h / 2) * (fi[0] + 2 * sumTrap + fi[n]);

    // ------------------------------
    //    SIMPSON 1/3 COMPUESTO
    // ------------------------------
    const sum4 = fi.filter((v, i) => i % 2 === 1 && i < n).reduce((a, b) => a + b, 0);
    const sum2 = fi.filter((v, i) => i % 2 === 0 && i !== 0 && i !== n).reduce((a, b) => a + b, 0);
    const simp13 = (h / 3) * (fi[0] + 4 * sum4 + 2 * sum2 + fi[n]);

    // ------------------------------
    //    SIMPSON 3/8 COMPUESTO
    // ------------------------------
    const sum3 = fi.slice(1, n).reduce((a, b, i) => {
        return a + ((i + 1) % 3 === 0 ? 2 * b : 3 * b);
    }, 0);
    const simp38 = (3 * h / 8) * (fi[0] + sum3 + fi[n]);

    // ------------------------------
    //    INTEGRAL EXACTA
    // ------------------------------
    let integral_exacta = null;

    try {
        // Intento simbólico
        const expr = math.parse(f_str);
        const F = math.integral(expr, "x");
        integral_exacta = F.evaluate({x: b}) - F.evaluate({x: a});
    } catch (e) {
        // Si falla, usar integración numérica muy fina (fallback)
        const steps = 20000;
        const hh = (b - a) / steps;
        let s = 0;
        for (let i = 0; i <= steps; i++) {
            let xval = a + i * hh;
            let w = (i === 0 || i === steps) ? 1 : (i % 2 === 0 ? 2 : 4);
            s += w * f(xval);
        }
        integral_exacta = (hh / 3) * s;
        mensajes += "La integral exacta simbólica no fue posible. Se usó integración numérica fina.<br>";
    }

    // ------------------------------
    //      ERRORES
    // ------------------------------
    const errTrap = Math.abs(integral_exacta - trap);
    const err13 = Math.abs(integral_exacta - simp13);
    const err38 = Math.abs(integral_exacta - simp38);

    const relTrap = errTrap / Math.abs(integral_exacta);
    const rel13 = err13 / Math.abs(integral_exacta);
    const rel38 = err38 / Math.abs(integral_exacta);

    // ------------------------------
    //     MOSTRAR RESULTADOS
    // ------------------------------
    document.getElementById("salida").innerHTML = `
        ${mensajes}
        <b>Integral exacta:</b> ${integral_exacta.toFixed(10)}<br><br>

        <b>Trapecio compuesto:</b> ${trap.toFixed(10)}<br>
        Error abs: ${errTrap.toExponential(3)} | Error rel: ${relTrap.toExponential(3)}<br><br>

        <b>Simpson 1/3 compuesto:</b> ${simp13.toFixed(10)}<br>
        Error abs: ${err13.toExponential(3)} | Error rel: ${rel13.toExponential(3)}<br><br>

        <b>Simpson 3/8 compuesto:</b> ${simp38.toFixed(10)}<br>
        Error abs: ${err38.toExponential(3)} | Error rel: ${rel38.toExponential(3)}<br>
    `;
}

</script>

</body>
</html>
