<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integración Numérica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; color: #333; }
    h2 { color: #2563eb; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input { padding: 8px; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; }
    button { padding: 10px 20px; margin-top: 20px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    .resultado { margin-top: 25px; padding: 15px; background: #f8fafc; border-left: 5px solid #2563eb; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-radius: 4px; }
    .warning { color: #d97706; font-size: 0.9em; margin-bottom: 10px; padding: 8px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 4px; }
    .method-box { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
</style>
</head>

<body>

<h2>Integración Numérica: Trapecio, Simpson 1/3 y Simpson 3/8</h2>
<p>Compara los métodos numéricos. El sistema ajustará <em>n</em> para que sea válido para todos los métodos.</p>

<label>Función f(x):</label>
<input id="fx" type="text" value="sin(x) + x^2" placeholder="Ej: sin(x) + x^2">

<label>Límite inferior (a):</label>
<input id="a" type="number" step="any" value="0">

<label>Límite superior (b):</label>
<input id="b" type="number" step="any" value="3">

<label>Subintervalos (n):</label>
<input id="n" type="number" step="1" value="6">
<small style="color: #666; display:block; margin-top:4px">Para Simpson 1/3, n debe ser par. Para Simpson 3/8, n debe ser múltiplo de 3.</small>

<button onclick="calcular()">Calcular Integrales</button>

<div id="salida"></div>

<script>
    function calcular() {
        const salida = document.getElementById("salida");
        salida.innerHTML = ""; // Limpiar
        
        // 1. Obtener entradas
        let f_str = document.getElementById("fx").value;
        const a = parseFloat(document.getElementById("a").value);
        const b = parseFloat(document.getElementById("b").value);
        let n = parseInt(document.getElementById("n").value);

        if(isNaN(a) || isNaN(b) || isNaN(n) || n < 1) {
            salida.innerHTML = "<p style='color:red'>Por favor, ingrese valores numéricos válidos.</p>";
            return;
        }

        // 2. Validar n para que funcione en TODOS los métodos
        // Trapecio: cualquiera. Simpson 1/3: par. Simpson 3/8: múltiplo de 3.
        // Para comparar los tres a la vez, n debe ser múltiplo de 6.
        let warnings = "";
        if (n % 6 !== 0) {
            let n_original = n;
            // Buscar el siguiente múltiplo de 6
            while (n % 6 !== 0) { n++; }
            warnings += `<div class='warning'>⚠️ Se ajustó <b>n</b> de ${n_original} a <b>${n}</b> para ser compatible con ambos métodos de Simpson (debe ser múltiplo de 2 y de 3).</div>`;
        }

        // 3. Preparar la función
        // Math.js maneja bien '^', pero nos aseguramos de capturar errores de sintaxis
        let f;
        try {
            const node = math.parse(f_str);
            const code = node.compile();
            f = (x_val) => code.evaluate({x: x_val});
            // Prueba rápida para ver si la función es válida
            f(a); 
        } catch (err) {
            salida.innerHTML = `<p style='color:red'>Error en la función: ${err.message}</p>`;
            return;
        }

        // 4. Calcular puntos (xi, yi)
        const h = (b - a) / n;
        const x = [];
        const y = [];
        for (let i = 0; i <= n; i++) {
            let valX = a + i * h;
            x.push(valX);
            y.push(f(valX));
        }

        // --- MÉTODO DEL TRAPECIO ---
        // I ≈ (h/2) * [y0 + 2(y1 + ... + yn-1) + yn]
        let sumTrap = 0;
        for (let i = 1; i < n; i++) { sumTrap += y[i]; }
        const I_trap = (h / 2) * (y[0] + 2 * sumTrap + y[n]);

        // --- MÉTODO SIMPSON 1/3 ---
        // I ≈ (h/3) * [y0 + 4(impares) + 2(pares) + yn]
        let sumImpar = 0;
        let sumPar = 0;
        for (let i = 1; i < n; i++) {
            if (i % 2 !== 0) sumImpar += y[i];
            else sumPar += y[i];
        }
        const I_13 = (h / 3) * (y[0] + 4 * sumImpar + 2 * sumPar + y[n]);

        // --- MÉTODO SIMPSON 3/8 ---
        // I ≈ (3h/8) * [y0 + 3y1 + 3y2 + 2y3 + ... + yn]
        // Patrón de coeficientes: 1, 3, 3, 2, 3, 3, 2, ..., 1
        let sum38 = 0;
        for (let i = 1; i < n; i++) {
            if (i % 3 === 0) sum38 += 2 * y[i]; // Múltiplo de 3
            else sum38 += 3 * y[i];             // El resto
        }
        const I_38 = (3 * h / 8) * (y[0] + sum38 + y[n]);

        // --- VALOR "EXACTO" (Calculado numéricamente con muy alta precisión) ---
        // Como Math.js no integra simbólicamente, usamos Simpson 1/3 con muchos pasos (ej. 100,000)
        const n_exact = 100000; 
        const h_exact = (b - a) / n_exact;
        let s_exact = f(a) + f(b);
        for(let i = 1; i < n_exact; i+=2) s_exact += 4 * f(a + i*h_exact);
        for(let i = 2; i < n_exact-1; i+=2) s_exact += 2 * f(a + i*h_exact);
        const I_exacta = (h_exact / 3) * s_exact;

        // --- CÁLCULO DE ERRORES ---
        const error = (val) => Math.abs(I_exacta - val);
        const errorRel = (val) => (Math.abs(I_exacta - val) / Math.abs(I_exacta)) * 100;

        // 5. Mostrar Resultados
        let html = `<div class="resultado">`;
        html += warnings;
        html += `<h3>Resultados (n = ${n}, h = ${h.toFixed(4)})</h3>`;
        html += `<div class="method-box"><strong>Valor "Exacto" (aprox. fina):</strong> ${I_exacta.toFixed(8)}</div>`;

        const printMethod = (name, val) => {
            const errAbs = error(val).toExponential(4);
            const errPorc = errorRel(val).toExponential(4);
            return `<div class="method-box">
                <b>${name}:</b> ${val.toFixed(8)}<br>
                <span style="font-size:0.9em; color:#555">Error Abs: ${errAbs} | Error Rel: ${errPorc}%</span>
            </div>`;
        };

        html += printMethod("Trapecio", I_trap);
        html += printMethod("Simpson 1/3", I_13);
        html += printMethod("Simpson 3/8", I_38);
        html += `</div>`;

        salida.innerHTML = html;
    }
</script>

</body>
</html>
