<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú Principal</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 400px;
        width: 90%;
    }

    h1 {
        margin-bottom: 25px;
    }

    button {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        background-color: #0077cc;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background-color: #005fa3;
        transform: scale(1.03);
    }
</style>
</head>

<body>

<div class="container">
    <h1>Seleccione una herramienta</h1>

    <button onclick="location.href='interpolacion.html'">
        Interpolación de Polinomios
    </button>

    <button onclick="location.href='integracion.html'">
        Integración Numérica
    </button>

    <button onclick="location.href='se.html'">
        Solución Numérica de Sistemas de Ecuaciones
    </button>

    <button onclick="location.href='solnumericas.html'">
        Solución Numérica de ecuaciones no lineales
    </button>

    
</div>


</body>
</html>
